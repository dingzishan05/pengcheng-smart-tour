limit_req_zone $binary_remote_addr zone=chat_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;

upstream backend_upstream {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    # 高德 JS API 2.0 的瓦片/矢量数据来自 *.is.autonavi.com、*.amap.com，
    # 页面本身是 http，高德的 marker 图标会走 http://webapi.amap.com，故 http/https 都需放行。
    # 高德初始化依赖 'unsafe-inline'（javascript: iframe）与 'unsafe-eval'（内部动态执行），
    # 缺任一都会让地图容器尺寸算成 0×0（表现就是灰屏、无瓦片）。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://webapi.amap.com https://*.amap.com; img-src 'self' data: blob: https://*.amap.com http://*.amap.com https://*.autonavi.com http://*.autonavi.com; style-src 'self' 'unsafe-inline' https://webapi.amap.com https://*.amap.com; font-src 'self' data: https://webapi.amap.com https://*.amap.com; connect-src 'self' https://*.amap.com http://*.amap.com https://*.autonavi.com http://*.autonavi.com; worker-src 'self' blob: data:; frame-src 'self' javascript: blob:" always;

    client_max_body_size 2m;

    location /api/v1/chat {
        limit_req zone=chat_limit burst=3 nodelay;
        proxy_pass http://backend_upstream;
        proxy_read_timeout 45s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/v1/admin/login {
        limit_req zone=login_limit burst=5 nodelay;
        proxy_pass http://backend_upstream;
        proxy_read_timeout 10s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_read_timeout 45s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
        proxy_pass http://backend_upstream/health;
        proxy_read_timeout 10s;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}